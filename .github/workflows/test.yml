name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgis-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: SQL integration and data-contract assertions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostGIS and wait for health
        run: docker compose up -d --wait db

      - name: Execute patterns and regression assertions
        run: bash scripts/run_examples.sh

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs --no-color db

      - name: Tear down disposable database
        if: always()
        run: docker compose down --volumes --remove-orphans || true
