name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Static repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate documentation and local links
        run: python3 scripts/check_docs.py
      - name: Require SQL examples and assertions
        run: |
          test -n "$(find sql patterns examples -type f -name '*.sql' -print -quit)"
          test -f tests/assertions.sql
          test -f scripts/benchmark_queries.sql
          test -f docs/production-runbook.md
          bash -n scripts/run_examples.sh scripts/wait_for_db.sh
